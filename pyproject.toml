[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciso-assistant-aws-compliance-automation"
version = "0.1.0"
description = "Evidence and remediation bridge from AWS and IaC scanners to CISO Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
keywords = ["ciso-assistant", "aws", "security-hub", "aws-config", "compliance-automation", "terraform"]

[project.scripts]
ca-aws-bridge = "ca_aws_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
